<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Cactus en el color de los botones (magenta #E129A1) -->
    <g fill="#E129A1">
        <!-- Tronco central -->
        <rect x="24" y="10" width="16" height="48" rx="8"/>
        <!-- Brazo izquierdo -->
        <rect x="12" y="26" width="14" height="12" rx="6"/>
        <rect x="12" y="16" width="12" height="22" rx="6"/>
        <!-- Brazo derecho -->
        <rect x="38" y="26" width="14" height="12" rx="6"/>
        <rect x="40" y="16" width="12" height="22" rx="6"/>
    </g>
    <!-- Maceta (magenta profundo de la paleta) -->
    <rect x="21" y="52" width="22" height="9" rx="4" fill="#97116B"/>
</svg>